edge_arch: Custom_GNN
edge_config:
  dropout_mlp: 0.5
  return_edges: false
  knn: -1
lr: 1.0e-05
optimizer: adamw
weight_decay: 1.0e-09
momentum: 0.9
lr_sched: linear
lr_sched_args:
  start_factor: 1
  end_factor: 0.2
  total_iters: 4000
loss_name: NDCG
loss_config:
  k: 3000
  reduction: mean
threshold: 20
batch_size: 1
shuffle_all: true
image_size:
- 224
- 224
num_workers: 8
show_data_stats: true
mean_std:
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
val_set_names:
- megadepth
image_num_fixed: 240
resample: true
aug: false
